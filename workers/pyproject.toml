[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobautomater-workers"
version = "0.1.0"
description = "Celery workers for JobAutomater (collectors, agents, tasks)"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "kombu>=5.4",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "respx>=0.21",
]
playwright = [
    "playwright>=1.40",
]

[tool.setuptools]
py-modules = ["celery_app", "config", "db", "storage"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tasks*", "agents*", "collectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
